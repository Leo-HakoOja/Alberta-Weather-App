workflows:
  ios-testflight:
    name: iOS TestFlight (Flutter)
    max_build_duration: 60

    integrations:
      app_store_connect: WeatherAppASC

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.yourname.weatherapp
      vars:
        FLUTTER_PROJECT_DIR: mobile/flutter_app
        BUNDLE_ID: com.yourname.weatherapp
        APPLE_TEAM_ID: "YOUR_TEAM_ID"
        WEATHER_API_URL: https://api.example.com/v1/weather/myrnam

    scripts:
      - name: Validate Flutter project
        script: |
          test -d "$FLUTTER_PROJECT_DIR"
          test -f "$FLUTTER_PROJECT_DIR/pubspec.yaml"

      - name: Flutter pub get
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter pub get

      - name: Set iOS bundle identifier + team for CI build
        script: |
          cd "$FLUTTER_PROJECT_DIR/ios"
          sed -i '' "s/com.example.flutterApp/$BUNDLE_ID/g" Runner.xcodeproj/project.pbxproj
          if ! grep -q "DEVELOPMENT_TEAM = $APPLE_TEAM_ID;" Runner.xcodeproj/project.pbxproj; then
            sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;\n\t\t\t\tDEVELOPMENT_TEAM = $APPLE_TEAM_ID;/g" Runner.xcodeproj/project.pbxproj
          fi

      - name: Install CocoaPods
        script: |
          cd "$FLUTTER_PROJECT_DIR/ios"
          pod install

      - name: Configure code signing
        script: |
          cd "$FLUTTER_PROJECT_DIR/ios"
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter build ipa \
            --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=WEATHER_API_URL=$WEATHER_API_URL

    artifacts:
      - mobile/flutter_app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/flutter_tools.*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Internal Testers
        expire_build_submitted_for_review: true

      email:
        recipients:
          - you@example.com
        notify:
          success: true
          failure: true
