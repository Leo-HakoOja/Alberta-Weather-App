workflows:
  ios-testflight:
    name: iOS TestFlight (Flutter)
    max_build_duration: 60

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true

    integrations:
      app_store_connect: WeatherAppASC

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      groups:
        - Notifications
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ca.hakooja.albertaweather
      vars:
        FLUTTER_PROJECT_DIR: mobile/flutter_app
        WEATHER_API_URL: https://alberta-weather-api.fly.dev/v1/weather/myrnam

    scripts:
      - name: Validate Flutter project
        script: |
          test -d "$FLUTTER_PROJECT_DIR"
          test -f "$FLUTTER_PROJECT_DIR/pubspec.yaml"

      - name: Flutter pub get
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter pub get

      - name: Install CocoaPods
        script: |
          cd "$FLUTTER_PROJECT_DIR/ios"
          pod install

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          cd "$FLUTTER_PROJECT_DIR"
          flutter build ipa \
            --release \
            --build-number=$BUILD_NUMBER \
            --dart-define=WEATHER_API_URL=$WEATHER_API_URL

    artifacts:
      - mobile/flutter_app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - /tmp/flutter_tools.*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - Family/Friends
        expire_build_submitted_for_review: true
